name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what the site ships (dev tools are left out)
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:worker
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ManBlows
          NEXT_PUBLIC_ASSISTANT_URL: ${{ vars.ASSISTANT_URL }}
      # Every page at three screen sizes, in French and English, in a real browser (scripts/smoke.mjs)
      - name: Browser smoke test
        run: |
          npm install --no-save playwright@1.65.0
          npx playwright install --with-deps chromium
          npm run smoke
        env:
          NEXT_PUBLIC_BASE_PATH: /ManBlows
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
